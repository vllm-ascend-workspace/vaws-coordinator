name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-plane:
    # No Ascend NPU, no Docker daemon, no torch/torch_npu: this is a
    # control-plane suite against the installed package and the bundled host
    # protocol, with simulated container and occupancy probes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install the package and run tests
        # remote-dev is a git package; its source URL belongs to the consumer
        # (or this CI job), not to this library's published metadata.
        run: |
          uv pip install "vaws-remote-dev @ git+https://github.com/vllm-ascend-workspace/remote-dev@v0.2.0"
          uv pip install pytest
          uv pip install -e . --no-deps
          python -m pytest -q
