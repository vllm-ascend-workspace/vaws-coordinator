name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-plane:
    # No Ascend NPU, no Docker daemon, no torch/torch_npu: this is a
    # control-plane suite against the installed package and the bundled host
    # protocol, with simulated container and occupancy probes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Authenticate private remote-dev if a token is present
        env:
          TOKEN: ${{ secrets.REMOTE_DEV_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install the package and run tests
        run: |
          uv pip install -e ".[test]"
          uv run python -m pytest -q
