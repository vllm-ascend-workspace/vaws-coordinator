name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  developer-setup:
    # Fresh checkout: nothing before the README commands may touch `.venv`.
    # `uv venv` (no `--clear`) is the first documented command; it must work
    # as a developer meets it on a clone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: false
          enable-cache: false

      - name: Documented developer setup
        run: |
          uv venv
          uv pip install "vaws-remote-dev @ git+https://github.com/vllm-ascend-workspace/remote-dev@v0.2.0"
          uv pip install pytest
          uv pip install -e . --no-deps
          .venv/bin/python -m pytest -q

  control-plane:
    # No Ascend NPU, no Docker daemon, no torch/torch_npu: this is a
    # control-plane suite against the installed package and the bundled host
    # protocol, with simulated container and occupancy probes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: false

      - name: Pip-style install without a project venv
        # Does not use the default `.venv`. Still must not reintroduce a
        # consumer-facing source pin.
        run: |
          uv venv .venv-pip
          VIRTUAL_ENV="$PWD/.venv-pip" uv pip install "vaws-remote-dev @ git+https://github.com/vllm-ascend-workspace/remote-dev@v0.2.0"
          VIRTUAL_ENV="$PWD/.venv-pip" uv pip install pytest
          VIRTUAL_ENV="$PWD/.venv-pip" uv pip install -e . --no-deps
          .venv-pip/bin/python -m pytest -q
