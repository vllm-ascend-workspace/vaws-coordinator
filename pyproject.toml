[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaws-coordinator"
version = "0.1.0"
description = "Local VAWS coordinator: task stdio MCP and host NPU allocation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Qi Mao" }]
dependencies = [
    "vaws-remote-dev",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vaws-coordinator = "vaws_coordinator.cli:main"

[project.urls]
Homepage = "https://github.com/vllm-ascend-workspace/vaws-coordinator"

[tool.hatch.build.targets.wheel]
packages = ["vaws_coordinator"]

[tool.hatch.build.targets.wheel.force-include]
"vaws_coordinator/vendor/UPSTREAM.json" = "vaws_coordinator/vendor/UPSTREAM.json"

[tool.uv.sources]
# remote-dev main has no pyproject yet. This path is the local stub used to
# install and test; switch to the git source when that repository ships a package:
# vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", branch = "main" }
vaws-remote-dev = { path = "tests/fakes/vaws-remote-dev" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
