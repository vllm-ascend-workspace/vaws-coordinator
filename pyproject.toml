[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaws-coordinator"
version = "0.4.1.dev1"
description = "Local VAWS coordinator: task stdio MCP and host NPU allocation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Qi Mao" }]
dependencies = [
    "vaws-remote-dev>=0.7.0",
    "setuptools-scm>=8",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4"]

[project.scripts]
vaws-coordinator = "vaws_coordinator.cli:main"

[project.urls]
Homepage = "https://github.com/vllm-ascend-workspace/vaws-coordinator"

[tool.hatch.build.targets.wheel]
packages = ["vaws_coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
